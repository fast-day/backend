resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== API =====
server {
    listen 443 ssl;
    http2 on;
    server_name api.fast-day.ru;
    include snippets/ssl.conf;

    location /docs {
        return 301 https://docs.api.fast-day.ru/docs;
    }

    location / {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        include snippets/proxy.conf;
        client_max_body_size 20M;
    }
}

# ===== SWAGGER =====
server {
    listen 443 ssl;
    http2 on;
    server_name docs.api.fast-day.ru;
    include snippets/ssl.conf;

    location = / { return 301 /docs; }

    location / {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        include snippets/proxy.conf;
    }
}

