services:
  nginx-proxy:
    container_name: nginx
    build: .
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done &
      nginx -g 'daemon off;'"
    networks:
      - shared

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    networks:
      - shared

networks:
  shared:
    external: true

volumes:
  certbot-www:
  letsencrypt:
