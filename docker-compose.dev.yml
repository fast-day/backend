services:
  postgres:
    container_name: postgres-dev-container
    image: postgres:18.0
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      # - ./data:/var/lib/postgresql/data
      - postgres_data:/var/lib/postgresql
    networks:
      - backend

  redis:
    container_name: redis-dev-container
    image: redis:8.2.2
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server --console-address ":9001" /data/
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - minio-storage:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  minio-init:
    image: minio/mc:latest
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set minio http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD};
      mc mb --ignore-existing minio/user-avatars;
      mc mb --ignore-existing minio/service-avatars;
      mc mb --ignore-existing minio/company-avatars;
      mc anonymous set public minio/user-avatars;
      mc anonymous set public minio/service-avatars;
      mc anonymous set public minio/company-avatars;
      tail -f /dev/null
      "
    restart: on-failure

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio-storage:
